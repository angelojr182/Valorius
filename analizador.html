<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Property Analyzer — Valorius</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="analizador.css?v=3.0"
  />

</head>

<body>

  <div class="topnav-mobile">

    <div class="tm-logo">
      V
    </div>

    <div class="tm-title">
      Property Analyzer
    </div>

    <a
      href="index.html"
      class="tm-btn"
    >
      Dashboard →
    </a>

  </div>

  <aside class="sidebar">

    <div class="sb-brand">

      <div class="sb-logo-v">
        V
      </div>

    </div>

    <nav class="sb-nav">

      <a
        href="index.html"
        class="sb-link"
      >
        Dashboard
      </a>

      <a
        href="analizador.html"
        class="sb-link active"
      >
        Analizar
      </a>

    </nav>

  </aside>

  <main class="main-content">

    <div class="page-hdr">

      <h1 class="page-title">
        Property Analyzer
      </h1>

      <p class="page-sub">
        Valorius Market Intelligence
      </p>

    </div>

    <section class="panel">

      <div class="panel-title">
        Datos de la propiedad
      </div>

      <form
        onsubmit="event.preventDefault(); actualizarAnalisis();"
      >

        <div class="formulario-grid">

          <!-- TIPO -->

          <div class="form-group-horizontal">

            <label class="form-label">
              Tipo de inmueble
            </label>

            <select
              id="selTipo"
              class="form-input"
            >

              <option value="">
                Seleccioná tipo
              </option>

              <option value="APARTAMENTO">
                Apartamento
              </option>

              <option value="CASA">
                Casa
              </option>

            </select>

          </div>

          <!-- ZONA -->

          <div class="form-group-horizontal">

            <label class="form-label">
              Zona
            </label>

            <select
              id="selZona"
              class="form-input"
              onchange="filtrarSubzonasYProyectos()"
              disabled
            >

              <option value="">
                Primero seleccioná tipo
              </option>

            </select>

          </div>

          <!-- SUBZONA -->

          <div class="form-group-horizontal">

            <label class="form-label">
              Subzona / Colonia
            </label>

            <select
              id="selSubzona"
              class="form-input"
              onchange="filtrarProyectos()"
              disabled
            >

              <option value="">
                Seleccioná una zona
              </option>

            </select>

          </div>

          <!-- PROYECTO -->

          <div class="form-group-horizontal">

            <label class="form-label">
              Proyecto
            </label>

            <select
              id="selProyecto"
              class="form-input"
              disabled
            >

              <option value="">
                Seleccioná una subzona
              </option>

            </select>

          </div>

          <!-- AREA -->

          <div class="form-group-horizontal">

            <label class="form-label">
              Área (m²)
            </label>

            <input
              type="number"
              id="inpArea"
              class="form-input"
              value="85"
              required
            />

          </div>

          <!-- PRECIO -->

          <div class="form-group-horizontal">

            <label class="form-label">
              Precio USD
            </label>

            <input
              type="text"
              id="inpPrecio"
              class="form-input"
              value="$180,000"
              required
            />

          </div>

        </div>

        <div class="form-row-actions">

          <button
            type="submit"
            class="btn-gold"
          >
            Analizar propiedad
          </button>

        </div>

      </form>

    </section>

  </main>

  <script src="secrets.js?v=1.2"></script>

  <script>

    const AZ_SURL =
      typeof SECRETS !== "undefined"
        ? SECRETS.SURL
        : "";

    const AZ_SKEY =
      typeof SECRETS !== "undefined"
        ? SECRETS.SKEY
        : "";

    const AZ_HEADERS = {

      apikey: AZ_SKEY,

      Authorization:
        "Bearer " + AZ_SKEY,

      "Content-Type":
        "application/json",

      "Accept-Profile":
        "core"

    };

    let azZonas = [];
    let azSubzonas = [];
    let azProyectos = [];

    async function azFetch(endpoint) {

      try {

        const res = await fetch(
          AZ_SURL + endpoint,
          {
            headers: AZ_HEADERS
          }
        );

        if (!res.ok) {

          console.error(
            "Fetch error:",
            res.status
          );

          return null;
        }

        return await res.json();

      } catch (e) {

        console.error(
          "azFetch error:",
          e
        );

        return null;
      }
    }

    async function azLoadZonas() {

      const data = await azFetch(
        "/rest/v1/v_zones_with_cluster?select=zona,cluster_name&order=zona"
      );

      return data || [];
    }

    async function azLoadSubzonas() {

      const data = await azFetch(
        "/rest/v1/dim_subzona?select=subzona,zona,tipo_inmueble&order=subzona"
      );

      return data || [];
    }

    async function azLoadProyectos() {

      const data = await azFetch(
        "/rest/v1/dim_proyecto?select=proyecto,zona,subzona,tipo_inmueble&order=proyecto"
      );

      return data || [];
    }

    async function cargarZonasPorTipo() {

      const tipo =
        document.getElementById(
          "selTipo"
        ).value;

      const selZona =
        document.getElementById(
          "selZona"
        );

      const selSubzona =
        document.getElementById(
          "selSubzona"
        );

      const selProyecto =
        document.getElementById(
          "selProyecto"
        );

      selSubzona.disabled = true;
      selProyecto.disabled = true;

      selSubzona.innerHTML =
        '<option value="">Seleccioná una zona</option>';

      selProyecto.innerHTML =
        '<option value="">Seleccioná una subzona</option>';

      if (!tipo) {

        selZona.disabled = true;

        selZona.innerHTML =
          '<option value="">Primero seleccioná tipo</option>';

        return;
      }

      const zonasFiltradas =

        azZonas.filter(z => {

          const match =

            azSubzonas.some(s =>

              s.zona &&
              s.tipo_inmueble === tipo &&
              s.zona.trim().toLowerCase() ===
              z.zona.trim().toLowerCase()

            );

          return match;

        });

      const seen = new Set();

      const zonasUnicas = zonasFiltradas.filter(z => {

        const nombre =
          z.zona.trim().toLowerCase();

        if (seen.has(nombre)) {
          return false;
        }

        seen.add(nombre);

        return true;

      });

      selZona.disabled = false;

      selZona.innerHTML =

        '<option value="">Seleccioná una zona</option>' +

        zonasUnicas.map(z =>

          `<option value="${z.zona}">
            ${z.zona}
          </option>`

        ).join("");
    }

    function filtrarSubzonasYProyectos() {

      const tipo =
        document.getElementById(
          "selTipo"
        ).value;

      const zona =
        document.getElementById(
          "selZona"
        ).value;

      const selSubzona =
        document.getElementById(
          "selSubzona"
        );

      const selProyecto =
        document.getElementById(
          "selProyecto"
        );

      selProyecto.disabled = true;

      selProyecto.innerHTML =
        '<option value="">Seleccioná una subzona</option>';

      if (!zona) {

        selSubzona.disabled = true;

        selSubzona.innerHTML =
          '<option value="">Seleccioná una zona</option>';

        return;
      }

      const subzonasFiltradas =

        azSubzonas.filter(s =>

          s.zona &&
          s.tipo_inmueble === tipo &&
          s.zona.trim().toLowerCase() ===
          zona.trim().toLowerCase()

        );

      selSubzona.disabled = false;

      selSubzona.innerHTML =

        '<option value="">Todas</option>' +

        subzonasFiltradas.map(s =>

          `<option value="${s.subzona}">
            ${s.subzona}
          </option>`

        ).join("");
    }

    function filtrarProyectos() {

      const tipo =
        document.getElementById(
          "selTipo"
        ).value;

      const zona =
        document.getElementById(
          "selZona"
        ).value;

      const subzona =
        document.getElementById(
          "selSubzona"
        ).value;

      const selProyecto =
        document.getElementById(
          "selProyecto"
        );

      if (!zona || !subzona) {

        selProyecto.disabled = true;

        selProyecto.innerHTML =
          '<option value="">Seleccioná una subzona</option>';

        return;
      }

      const proyectosFiltrados =

        azProyectos.filter(p => {

          const tipoMatch =

            p.tipo_inmueble === tipo;

          const zonaMatch =

            p.zona &&
            p.zona.trim().toLowerCase() ===
            zona.trim().toLowerCase();

          const subzonaMatch =

            p.subzona &&
            p.subzona.trim().toLowerCase() ===
            subzona.trim().toLowerCase();

          return (
            tipoMatch &&
            zonaMatch &&
            subzonaMatch
          );

        });

      selProyecto.disabled = false;

      selProyecto.innerHTML =

        '<option value="">Todos</option>' +

        proyectosFiltrados.map(p =>

          `<option value="${p.proyecto}">
            ${p.proyecto}
          </option>`

        ).join("");
    }

    async function actualizarAnalisis() {

      const tipo =
        document.getElementById(
          "selTipo"
        ).value;

      const zona =
        document.getElementById(
          "selZona"
        ).value;

      const subzona =
        document.getElementById(
          "selSubzona"
        ).value;

      const proyecto =
        document.getElementById(
          "selProyecto"
        ).value;

      const area =
        parseFloat(
          document.getElementById(
            "inpArea"
          ).value
        ) || 0;

      const precio =
        parseFloat(
          document
            .getElementById(
              "inpPrecio"
            )
            .value
            .replace(
              /[^0-9.]/g,
              ""
            )
        ) || 0;

      console.log({

        tipo,
        zona,
        subzona,
        proyecto,
        area,
        precio

      });

      alert(
        "Análisis ejecutado correctamente."
      );
    }

    document.addEventListener(

      "DOMContentLoaded",

      async () => {

        azZonas =
          await azLoadZonas();

        azSubzonas =
          await azLoadSubzonas();

        azProyectos =
          await azLoadProyectos();

        document
          .getElementById(
            "selTipo"
          )
          .addEventListener(
            "change",
            cargarZonasPorTipo
          );

      }

    );

  </script>

</body>
</html>
