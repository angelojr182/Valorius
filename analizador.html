<script>

const ZONAS_FALLBACK = [
  { zona: "Anillo Periférico", cluster_name: "COMERCIAL_CENTRO" },
  { zona: "Bulevar Morazán", cluster_name: "COMERCIAL_CENTRO" },
  { zona: "Colonia Palmira", cluster_name: "COMERCIAL_CENTRO" },
  { zona: "El Trapiche", cluster_name: "PREMIUM_NORTE" },
  { zona: "Las Colinas", cluster_name: "PREMIUM_NORTE" },
  { zona: "Las Uvas", cluster_name: "RESIDENCIAL_ESTE" },
  { zona: "Lomas del Guijarro", cluster_name: "PREMIUM_NORTE" },
  { zona: "Miraflores", cluster_name: "PREMIUM_NORTE" },
  { zona: "Residencial Buena Vista", cluster_name: "PREMIUM_NORTE" },
  { zona: "Residencial Centroamérica", cluster_name: "RESIDENCIAL_ESTE" },
  { zona: "Residencial El Sauce", cluster_name: "RESIDENCIAL_ESTE" },
  { zona: "Residencial Hacienda Real", cluster_name: "RESIDENCIAL_ESTE" },
  { zona: "Residencial Las Casitas", cluster_name: "RESIDENCIAL_ESTE" },
  { zona: "Residencial Los Cerezos", cluster_name: "PREMIUM_NORTE" },
  { zona: "Residencial Portal del Bosque 1", cluster_name: "RESIDENCIAL_ESTE" },
  { zona: "Residencial Quinta Isabel", cluster_name: "RESIDENCIAL_ESTE" },
  { zona: "Residencial Villa Elena", cluster_name: "PREMIUM_NORTE" },
  { zona: "San Ignacio", cluster_name: "PREMIUM_NORTE" }
];

const AZ_SURL = typeof SECRETS !== "undefined" ? SECRETS.SURL : "";
const AZ_SKEY = typeof SECRETS !== "undefined" ? SECRETS.SKEY : "";

const AZ_HEADERS = {
  apikey: AZ_SKEY,
  Authorization: "Bearer " + AZ_SKEY,
  "Content-Type": "application/json",
  "Accept-Profile": "core"
};

let azZonas = [];
let azSubzonas = [];
let azProyectos = [];

async function azFetch(endpoint) {
  try {
    const res = await fetch(AZ_SURL + endpoint, {
      headers: AZ_HEADERS
    });

    if (!res.ok) {
      console.error("Fetch error:", res.status);
      return null;
    }

    return await res.json();

  } catch (e) {
    console.error("azFetch error:", e);
    return null;
  }
}

async function azLoadZonas() {

  const tipo = document.getElementById("selTipo").value;

  const data = await azFetch(
    `/rest/v1/v_zones_with_cluster?select=zone_id,zona,cluster_name,tipo_inmueble`
  );

  if (!data || !Array.isArray(data)) {
    return ZONAS_FALLBACK;
  }

  const filtradas = data.filter(
    z => !z.tipo_inmueble || z.tipo_inmueble === tipo
  );

  const unicas = [];
  const seen = new Set();

  filtradas.forEach(z => {
    if (!seen.has(z.zona)) {
      seen.add(z.zona);
      unicas.push(z);
    }
  });

  return unicas;
}

async function azLoadSubzonas() {

  const data = await azFetch(
    "/rest/v1/dim_subzona?select=subzona_id,subzona,zone_id&order=subzona"
  );

  return data || [];
}

async function azLoadProyectos() {

  const data = await azFetch(
    "/rest/v1/dim_proyecto?select=proyecto_id,proyecto,zone_id&order=proyecto"
  );

  return data || [];
}

async function cargarZonas() {

  azZonas = await azLoadZonas();

  const selZona = document.getElementById("selZona");

  selZona.innerHTML =
    '<option value="">Seleccioná una zona</option>' +
    azZonas.map(z =>
      `<option value="${z.zona}">${z.zona}</option>`
    ).join("");

  document.getElementById("selSubzona").innerHTML =
    '<option value="">Todas</option>';

  document.getElementById("selProyecto").innerHTML =
    '<option value="">Todos</option>';
}

window.filtrarSubzonasYProyectos = function () {

  const zona = document.getElementById("selZona").value;

  const selSubzona = document.getElementById("selSubzona");
  const selProyecto = document.getElementById("selProyecto");

  if (!zona) {

    selSubzona.innerHTML =
      '<option value="">Todas</option>';

    selProyecto.innerHTML =
      '<option value="">Todos</option>';

    return;
  }

  const zonaObj = azZonas.find(
    z => z.zona === zona
  );

  if (!zonaObj) return;

  const subzonasFiltradas = azSubzonas.filter(
    s => String(s.zone_id) === String(zonaObj.zone_id)
  );

  const proyectosFiltrados = azProyectos.filter(
    p => String(p.zone_id) === String(zonaObj.zone_id)
  );

  selSubzona.innerHTML =
    '<option value="">Todas</option>' +
    subzonasFiltradas.map(s =>
      `<option value="${s.subzona}">${s.subzona}</option>`
    ).join("");

  selProyecto.innerHTML =
    '<option value="">Todos</option>' +
    proyectosFiltrados.map(p =>
      `<option value="${p.proyecto}">${p.proyecto}</option>`
    ).join("");
};

document.addEventListener("DOMContentLoaded", async () => {

  azSubzonas = await azLoadSubzonas();
  azProyectos = await azLoadProyectos();

  await cargarZonas();

  document
    .getElementById("selTipo")
    .addEventListener("change", cargarZonas);

});

</script>
