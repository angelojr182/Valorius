<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Property Analyzer — Valorius</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#060f20;
      --panel:#0d172b;
      --panel-2:#111d35;
      --gold:#e2b05c;
      --gold-soft:#f4d38f;
      --text:#f5f7fb;
      --muted:#8d99ae;
      --border:rgba(255,255,255,.06);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Inter',sans-serif;
      padding:40px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      margin-bottom:30px;
    }

    .title{
      font-size:34px;
      font-weight:700;
      color:var(--gold);
    }

    .subtitle{
      color:var(--muted);
      margin-top:8px;
    }

    .panel{
      background:linear-gradient(
        180deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.01)
      );
      border:1px solid var(--border);
      border-radius:24px;
      padding:28px;
      backdrop-filter:blur(20px);
      margin-bottom:24px;
    }

    .panel-title{
      color:var(--gold);
      font-size:14px;
      letter-spacing:.12em;
      margin-bottom:22px;
      text-transform:uppercase;
      font-weight:600;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:18px;
    }

    .group{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    label{
      font-size:13px;
      color:var(--muted);
    }

    select,
    input{
      height:52px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      color:white;
      padding:0 16px;
      font-size:15px;
      outline:none;
    }

    select:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    button{
      margin-top:22px;
      width:100%;
      height:56px;
      border:none;
      border-radius:16px;
      background:linear-gradient(
        135deg,
        #f4d38f,
        #c8953f
      );
      color:#111;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    .result{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:24px;
      margin-top:24px;
    }

    .metric{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.05);
      border-radius:18px;
      padding:22px;
    }

    .metric-label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .metric-value{
      font-size:32px;
      color:var(--gold-soft);
      font-weight:700;
    }

    @media(max-width:900px){
      body{
        padding:18px;
      }

      .result{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="title">Property Analyzer</div>
    <div class="subtitle">
      Valorius Market Intelligence
    </div>
  </div>

  <div class="panel">

    <div class="panel-title">
      Datos de la propiedad
    </div>

    <div class="grid">

      <div class="group">
        <label>Tipo de inmueble</label>

        <select
          id="selTipo"
          onchange="filtrarZonasPorTipo()"
        >
          <option value="">Seleccioná tipo</option>
          <option value="APARTAMENTO">Apartamento</option>
          <option value="CASA">Casa</option>
        </select>
      </div>

      <div class="group">
        <label>Zona</label>

        <select
          id="selZona"
          onchange="filtrarSubzonasYProyectos()"
          disabled
        >
          <option value="">
            Primero seleccioná tipo
          </option>
        </select>
      </div>

      <div class="group">
        <label>Subzona</label>

        <select
          id="selSubzona"
          onchange="filtrarProyectos()"
          disabled
        >
          <option value="">Todas</option>
        </select>
      </div>

      <div class="group">
        <label>Proyecto</label>

        <select
          id="selProyecto"
          disabled
        >
          <option value="">Todos</option>
        </select>
      </div>

      <div class="group">
        <label>Área construcción (m²)</label>

        <input
          type="number"
          id="inpArea"
          value="85"
        />
      </div>

      <div class="group">
        <label>Precio solicitado (USD)</label>

        <input
          type="text"
          id="inpPrecio"
          value="180000"
        />
      </div>

    </div>

    <button onclick="alert('Análisis funcionando')">
      Analizar propiedad
    </button>

  </div>

  <div class="result">

    <div class="metric">
      <div class="metric-label">
        Mediana de mercado
      </div>

      <div class="metric-value">
        $2,655/m²
      </div>
    </div>

    <div class="metric">
      <div class="metric-label">
        Posicionamiento
      </div>

      <div class="metric-value">
        +14%
      </div>
    </div>

  </div>

</div>

<script>

/* =========================
   CONFIG
========================= */

const AZ_SURL =
  typeof SECRETS !== "undefined"
    ? SECRETS.SURL
    : "";

const AZ_SKEY =
  typeof SECRETS !== "undefined"
    ? SECRETS.SKEY
    : "";

const AZ_HEADERS = {
  apikey: AZ_SKEY,
  Authorization: "Bearer " + AZ_SKEY,
  "Content-Type": "application/json",
  "Accept-Profile": "core"
};

/* =========================
   STATE
========================= */

let azZonas = [];
let azSubzonas = [];
let azProyectos = [];

/* =========================
   HELPERS
========================= */

async function azFetch(endpoint){

  try{

    const res = await fetch(
      AZ_SURL + endpoint,
      { headers: AZ_HEADERS }
    );

    if(!res.ok){
      console.error(
        "Supabase error:",
        res.status,
        endpoint
      );
      return [];
    }

    return await res.json();

  }catch(e){

    console.error("Fetch error:",e);
    return [];
  }
}

/* =========================
   LOADERS
========================= */

async function azLoadZonas(){

  return await azFetch(
    "/rest/v1/v_property_full?select=zona,tipo_inmueble"
  );
}

async function azLoadSubzonas(){

  return await azFetch(
    "/rest/v1/v_property_full?select=subzona,zona,tipo_inmueble"
  );
}

async function azLoadProyectos(){

  return await azFetch(
    "/rest/v1/v_property_full?select=proyecto,subzona,zona,tipo_inmueble"
  );
}

/* =========================
   DOM
========================= */

const selTipo =
  document.getElementById("selTipo");

const selZona =
  document.getElementById("selZona");

const selSubzona =
  document.getElementById("selSubzona");

const selProyecto =
  document.getElementById("selProyecto");

/* =========================
   RESET
========================= */

function resetZona(){

  selZona.innerHTML =
    '<option value="">Seleccioná una zona</option>';

  selZona.disabled = true;
}

function resetSubzona(){

  selSubzona.innerHTML =
    '<option value="">Todas</option>';

  selSubzona.disabled = true;
}

function resetProyecto(){

  selProyecto.innerHTML =
    '<option value="">Todos</option>';

  selProyecto.disabled = true;
}

/* =========================
   FILTRAR ZONAS
========================= */

function filtrarZonasPorTipo(){

  const tipo = selTipo.value;

  resetZona();
  resetSubzona();
  resetProyecto();

  if(!tipo) return;

  const zonas = azZonas.filter(
    z =>
      z.tipo_inmueble &&
      z.tipo_inmueble.toUpperCase() === tipo
  );

  const zonasUnicas =
    [...new Set(zonas.map(z => z.zona))]
      .filter(Boolean)
      .sort();

  selZona.innerHTML =
    '<option value="">Seleccioná una zona</option>' +
    zonasUnicas.map(
      z => `<option value="${z}">${z}</option>`
    ).join("");

  selZona.disabled = false;
}

/* =========================
   FILTRAR SUBZONAS
========================= */

function filtrarSubzonasYProyectos(){

  const tipo = selTipo.value;
  const zona = selZona.value;

  resetSubzona();
  resetProyecto();

  if(!tipo || !zona) return;

  const subzonas = azSubzonas.filter(
    s =>
      s.tipo_inmueble &&
      s.tipo_inmueble.toUpperCase() === tipo &&
      s.zona === zona
  );

  const subzonasUnicas =
    [...new Set(subzonas.map(s => s.subzona))]
      .filter(Boolean)
      .sort();

  selSubzona.innerHTML =
    '<option value="">Todas</option>' +
    subzonasUnicas.map(
      s => `<option value="${s}">${s}</option>`
    ).join("");

  selSubzona.disabled = false;
}

/* =========================
   FILTRAR PROYECTOS
========================= */

function filtrarProyectos(){

  const tipo = selTipo.value;
  const zona = selZona.value;
  const subzona = selSubzona.value;

  resetProyecto();

  if(!tipo || !zona) return;

  const proyectos = azProyectos.filter(
    p => {

      const okTipo =
        p.tipo_inmueble &&
        p.tipo_inmueble.toUpperCase() === tipo;

      const okZona =
        p.zona === zona;

      const okSubzona =
        !subzona ||
        p.subzona === subzona;

      return okTipo && okZona && okSubzona;
    }
  );

  const proyectosUnicos =
    [...new Set(proyectos.map(p => p.proyecto))]
      .filter(Boolean)
      .sort();

  selProyecto.innerHTML =
    '<option value="">Todos</option>' +
    proyectosUnicos.map(
      p => `<option value="${p}">${p}</option>`
    ).join("");

  selProyecto.disabled = false;
}

/* =========================
   INIT
========================= */

window.onload = async function(){

  resetZona();
  resetSubzona();
  resetProyecto();

  azZonas = await azLoadZonas();
  azSubzonas = await azLoadSubzonas();
  azProyectos = await azLoadProyectos();

  console.log("Zonas:", azZonas.length);
  console.log("Subzonas:", azSubzonas.length);
  console.log("Proyectos:", azProyectos.length);
};

</script>

</body>
</html>
