<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Valorius</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a1428 0%, #1a1f3a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(226, 176, 92, 0.2);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e2b05c;
      letter-spacing: -0.5px;
    }
    .logo p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(203, 213, 225, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 14px;
      transition: all 0.2s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      background: rgba(203, 213, 225, 0.08);
      border-color: #e2b05c;
      box-shadow: 0 0 0 3px rgba(226, 176, 92, 0.1);
    }
    input::placeholder {
      color: #64748b;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #e2b05c 0%, #d4a850 100%);
      color: #0a1428;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(226, 176, 92, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .loading {
      display: none;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }
    .loading.show {
      display: block;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(226, 176, 92, 0.3);
      border-top-color: #e2b05c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .info {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 20px;
      line-height: 1.5;
    }
    .info a {
      color: #e2b05c;
      text-decoration: none;
      font-weight: 600;
    }
    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>VALORIUS</h1>
      <p>Market Intelligence</p>
    </div>

    <div id="errorMsg" class="error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tu@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
    </form>

    <div id="loading" class="loading">
      <span class="spinner"></span> Autenticando...
    </div>

    <div class="info">
      ¿No tienes cuenta? Contacta a <a href="mailto:angelojr182@gmail.com">soporte</a>
    </div>
  </div>

  <script src="../secrets.js?v=1.2"></script>
  <script>
    // Obtener parámetro redirect de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const redirect = urlParams.get('redirect') || 'dashboard';

    // Inicializar Supabase
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('errorMsg');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Verificar si ya hay sesión activa
    supabaseClient.auth.onAuthStateChanged(async (session) => {
      if (session) {
        // User ya está autenticado — redirigir al destino
        window.location.href = `../${redirect}/`;
      }
    });

    // Manejar el login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Por favor completa todos los campos');
        return;
      }

      // Mostrar loading, ocultar error
      loading.classList.add('show');
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showError(error.message || 'Error al iniciar sesión');
          submitBtn.disabled = false;
          loading.classList.remove('show');
          return;
        }

        if (data.session) {
          // Login exitoso — redirigir al destino
          loading.classList.remove('show');
          submitBtn.disabled = false;
          window.location.href = `../${redirect}/`;
        }
      } catch (err) {
        showError('Error de conexión. Intenta de nuevo.');
        console.error(err);
        submitBtn.disabled = false;
        loading.classList.remove('show');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }
  </script>
</body>
</html>
