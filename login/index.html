<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Iniciar sesión — Valorius</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a1428 0%, #1a1f3a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(226, 176, 92, 0.2);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e2b05c;
      letter-spacing: -0.5px;
    }
    .logo p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(203, 213, 225, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 14px;
      transition: all 0.2s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      background: rgba(203, 213, 225, 0.08);
      border-color: #e2b05c;
      box-shadow: 0 0 0 3px rgba(226, 176, 92, 0.1);
    }
    input::placeholder {
      color: #64748b;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #e2b05c 0%, #d4a850 100%);
      color: #0a1428;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(226, 176, 92, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .error.show {
      display: block;
    }
    .loading {
      display: none;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }
    .loading.show {
      display: block;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(226, 176, 92, 0.3);
      border-top-color: #e2b05c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .info {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 20px;
      line-height: 1.5;
    }
    .info a {
      color: #e2b05c;
      text-decoration: none;
      font-weight: 600;
    }
    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>VALORIUS</h1>
      <p>Market Intelligence</p>
    </div>

    <div id="errorMsg" class="error"></div>

    <!-- IMPORTANTE: method="POST" para NO pasar credenciales en URL -->
    <form id="loginForm" method="POST" action="#">
      <div class="form-group">
        <label for="email">Correo</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="tu@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
    </form>

    <div id="loading" class="loading">
      <span class="spinner"></span> Autenticando...
    </div>

    <div class="info">
      ¿No tienes cuenta? Contacta a <a href="mailto:angelojr182@gmail.com">soporte</a>
    </div>
  </div>

  <script src="../secrets.js?v=1.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    'use strict';

    // Obtener parámetro redirect de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const redirect = urlParams.get('redirect') || 'dashboard';

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('errorMsg');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    /**
     * Mostrar mensaje de error
     */
    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }

    /**
     * Limpiar error
     */
    function clearError() {
      errorMsg.classList.remove('show');
      errorMsg.textContent = '';
    }

    /**
     * Verificar autenticación existente
     */
    async function checkExistingSession() {
      // Verificar que secrets.js esté cargado
      if (!SECRETS || !SECRETS.SURL || !SECRETS.SKEY) {
        console.error('❌ secrets.js no está cargado');
        return;
      }

      try {
        const { createClient } = supabase;
        const supabaseClient = createClient(SECRETS.SURL, SECRETS.SKEY);

        const { data: { session }, error } = await supabaseClient.auth.getSession();

        if (session && !error) {
          // Ya hay sesión activa — redirigir al destino
          console.log('✅ Sesión activa detectada, redirigiendo...');
          window.location.href = `../${redirect}/`;
        }
      } catch (e) {
        console.error('Error verificando sesión:', e);
      }
    }

    /**
     * Manejar submit del formulario
     */
    async function handleLogin(e) {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validación básica
      if (!email || !password) {
        showError('Por favor completa todos los campos');
        return;
      }

      if (!email.includes('@')) {
        showError('Correo electrónico inválido');
        return;
      }

      // Verificar que secrets.js esté cargado
      if (!SECRETS || !SECRETS.SURL || !SECRETS.SKEY) {
        showError('Error de configuración — intenta recargar la página');
        console.error('secrets.js no está cargado');
        return;
      }

      // Mostrar loading
      clearError();
      loading.classList.add('show');
      submitBtn.disabled = true;

      try {
        // Inicializar Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SECRETS.SURL, SECRETS.SKEY);

        // Intentar login
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          // Error de Supabase
          showError(error.message || 'Correo o contraseña incorrectos');
          loading.classList.remove('show');
          submitBtn.disabled = false;
          // Limpiar campos de contraseña (seguridad)
          passwordInput.value = '';
          return;
        }

        if (data.session) {
          // Login exitoso
          console.log('✅ Login exitoso:', data.user.email);
          loading.classList.remove('show');
          submitBtn.disabled = false;

          // Limpiar campos antes de redirigir
          emailInput.value = '';
          passwordInput.value = '';

          // Redirigir al destino
          window.location.href = `../${redirect}/`;
        }
      } catch (err) {
        console.error('❌ Error de conexión:', err);
        showError('Error de conexión. Intenta de nuevo.');
        loading.classList.remove('show');
        submitBtn.disabled = false;
        passwordInput.value = '';
      }
    }

    // Event listeners
    form.addEventListener('submit', handleLogin);

    // Verificar sesión al cargar
    window.addEventListener('load', checkExistingSession);
  </script>
</body>
</html>
