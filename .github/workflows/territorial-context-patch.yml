name: Apply Territorial Context Patch

on:
  push:
    branches:
      - feat/territorial-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/territorial-context
          fetch-depth: 0

      - name: Apply exact surgical change
        shell: python
        run: |
          from pathlib import Path

          path = Path('ingesta.html')
          text = path.read_text(encoding='utf-8')
          old = "setTimeout(limpiarFormulario, 2000);"
          new = "window.location.href = 'analizador.html?property_id=' + encodeURIComponent(propId);"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'ABORT: expected exactly 1 occurrence, found {count}')

          if new in text:
              raise SystemExit('ABORT: target change already present')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat
          git diff -- ingesta.html

      - name: Commit exact change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/territorial-context-patch.yml
          git add ingesta.html .github/workflows/territorial-context-patch.yml
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- ingesta.html
          git commit -m "feat: pass property id to analyzer"
          git push origin feat/territorial-context
