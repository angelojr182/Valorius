name: Scraper Rentify

on:
  workflow_dispatch:  # solo manual por ahora — tú decides cuándo corre

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Instalar Playwright (Chromium)
        run: python -m playwright install chromium --with-deps

      - name: Correr scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/scraper_rentify.py

      - name: Subir CSV como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rentify-csv-${{ github.run_id }}
          path: |
            outputs/rentify_*.csv
            outputs/debug/
          retention-days: 30
