name: Phase 3 acceptance

on:
  push:
    branches:
      - feat/territorial-context
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f analyzer/analizador.html
          test -f analyzer/components/AnalysisSummary.js
          test -f analyzer/components/ConfidenceIndicator.js
          test -f analyzer/components/PriceCard.js
          grep -q "AnalysisSummary.mount" analyzer/analizador.html
          grep -q "ConfidenceIndicator.mount" analyzer/analizador.html
          grep -q "PriceCard.mount" analyzer/analizador.html
          ! grep -q "renderAnalysisSummary\|renderConfidenceIndicator\|renderPriceCard\|installProductionHook" analyzer/analizador.html

      - name: Syntax check component modules
        shell: bash
        run: |
          set -euo pipefail
          node --check analyzer/components/AnalysisSummary.js
          node --check analyzer/components/ConfidenceIndicator.js
          node --check analyzer/components/PriceCard.js

      - name: Extract and syntax check inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("analyzer/analizador.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for i, script in enumerate(scripts, 1):
              Path(f"/tmp/valorius-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s)")
          PY
          for f in /tmp/valorius-inline-*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/valorius-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});

            // Production page: verify the existing authentication gate.
            const production = await browser.newPage();
            const productionErrors = [];
            production.on('pageerror', e => productionErrors.push(String(e)));

            await production.goto(
              'http://127.0.0.1:4173/analyzer/analizador.html',
              { waitUntil: 'domcontentloaded', timeout: 30000 }
            );
            await production.waitForTimeout(2500);

            const productionResult = await production.evaluate(() => ({
              title: document.title,
              url: location.href
            }));

            console.log('production:', JSON.stringify(productionResult, null, 2));
            console.log('production pageErrors:', JSON.stringify(productionErrors));

            if (!productionResult.url.includes('/login/index.html?redirect=analyzer')) {
              throw new Error('Expected unauthenticated Analyzer access to redirect to login');
            }
            if (productionErrors.length) {
              throw new Error('Production page errors detected during auth-gate test');
            }

            // Isolated component regression: exercise the exact Phase 3 components
            // without bypassing or changing production authentication.
            const fixture = await browser.newPage();
            const fixtureErrors = [];
            fixture.on('pageerror', e => fixtureErrors.push(String(e)));

            await fixture.setContent(`
              <div id="veredictoPanel"></div>
              <div id="iaoCard"></div>
              <div id="priceCardContainer"></div>
            `);

            for (const file of [
              'analyzer/components/AnalysisSummary.js',
              'analyzer/components/ConfidenceIndicator.js',
              'analyzer/components/PriceCard.js'
            ]) {
              await fixture.addScriptTag({ content: fs.readFileSync(file, 'utf8') });
            }

            const componentResult = await fixture.evaluate(() => {
              AnalysisSummary.mount('veredictoPanel', {
                modoLimitado: false,
                nivelZona: false,
                n: 8,
                iprInt: { categoria: 'rango', clase: 'vrd-rango', etiqueta: 'Precio dentro del rango' },
                descripcion: 'Referencia de prueba'
              });

              ConfidenceIndicator.mount('iaoCard', {
                n: 8,
                modoLimitado: false,
                nivel: '',
                iaoInt: { clase: 'iao-alta', icono: '●', etiqueta: 'Alta actividad' }
              });

              PriceCard.mount('priceCardContainer', {
                userPriceM2: 1250,
                areaM2: 120,
                totalPrice: 150000,
                medianPriceM2: 1312.54,
                deviationPct: -4.8
              });

              return {
                summary: document.querySelector('#veredictoPanel .vrd-titulo')?.textContent || '',
                confidence: document.querySelector('#iaoCard .iao-valor')?.textContent || '',
                price: document.querySelector('#priceCardContainer .pc-value')?.textContent || '',
                summaryClass: document.getElementById('veredictoPanel').className,
                confidenceClass: document.getElementById('iaoCard').className,
                priceClass: document.querySelector('#priceCardContainer .price-card')?.className || ''
              };
            });

            console.log('components:', JSON.stringify(componentResult, null, 2));
            console.log('component pageErrors:', JSON.stringify(fixtureErrors));

            if (!componentResult.summary) throw new Error('AnalysisSummary did not render');
            if (!componentResult.confidence) throw new Error('ConfidenceIndicator did not render');
            if (!componentResult.price.includes('$1,250')) throw new Error('PriceCard did not render expected price/m²');
            if (!componentResult.summaryClass.includes('vrd-rango')) throw new Error('AnalysisSummary category class missing');
            if (!componentResult.confidenceClass.includes('iao-alta')) throw new Error('ConfidenceIndicator class missing');
            if (!componentResult.priceClass.includes('pc-range')) throw new Error('PriceCard range class missing');
            if (fixtureErrors.length) throw new Error('Component page errors detected');

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-acceptance-diagnostics
          path: |
            /tmp/valorius-http.log
            /tmp/valorius-inline-*.js
          if-no-files-found: ignore
